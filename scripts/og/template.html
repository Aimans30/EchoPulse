<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:627px;overflow:hidden;background:#0C0C0B}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11';color:#F2EEE7}
#c{position:relative;width:1200px;height:627px;overflow:hidden;background:#0C0C0B;--a:#E8541A}
.abs{position:absolute}
.glow{left:560px;top:-120px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 20%,transparent) 0%,transparent 62%)}
.big{left:820px;top:104px;width:600px}
.lock{left:60px;top:56px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px;letter-spacing:-.02em}
.lock img{height:21px;display:block}
.lock b{color:#E8541A;font-weight:800;margin-left:-9px}
.lock .m{font-weight:500;font-size:17px;color:#8C887F;letter-spacing:0;margin-left:3px}
.eyebrow{left:60px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:.01em;color:#B5B0A6}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--a);display:block}
.h{left:60px;font-family:'Inter Display','Inter',sans-serif;font-weight:700;letter-spacing:-.035em;line-height:1.04;color:#F2EEE7;text-wrap:balance}
.h em{font-style:normal;color:var(--a)}
.sub{left:60px;color:#B5B0A6;font-weight:450;letter-spacing:-.008em;line-height:1.38}
.cta{left:60px;bottom:60px;display:inline-flex;align-items:center;gap:12px;font-size:22px;font-weight:650;letter-spacing:-.012em;background:#F2EEE7;color:#0C0C0B;border-radius:999px;padding:0 8px 0 24px;height:52px}
.cta .o{color:#D9480F}
.dot{width:36px;height:36px;border-radius:50%;background:#E8541A;display:grid;place-items:center}
.card{border-radius:18px;overflow:hidden;background:#161614;box-shadow:0 0 0 1px rgba(242,238,231,.12),0 30px 70px rgba(0,0,0,.55)}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.plan{display:flex;justify-content:space-between;align-items:center;width:400px;height:76px;padding:0 28px;border-radius:16px;background:#161614;box-shadow:0 0 0 1px rgba(242,238,231,.12);font-family:'Inter Display','Inter',sans-serif}
.plan span{font-size:22px;font-weight:600;color:#B5B0A6;letter-spacing:-.01em}
.plan b{font-size:30px;font-weight:700;letter-spacing:-.03em;color:#F2EEE7}
.plan.on{background:#F2EEE7;box-shadow:none}.plan.on span{color:#4A4740}.plan.on b{color:#0C0C0B}
</style></head><body><div id="c"></div>
<script>
window.render=async function(p){
 const c=document.getElementById('c'); const v=p.visual||{type:'mark'};
 c.style.setProperty('--a',p.accent||'#E8541A');
 const wide = v.type==='mark';
 const colW = wide?680:(v.type==='plans'?560:540);
 const plain=p.headline.replace(/\*/g,'');
 const fs = wide?(plain.length>38?74:86):(plain.length>34?60:68);
 let h='';
 h+=`<div class="abs glow"></div>`;
 if(v.type==='mark') h+=`<img class="abs big" src="assets/mark.png">`;
  if(v.type==='shot') h+=`<div class="abs card" style="left:640px;top:150px;width:500px;height:330px"><img src="${v.src}" style="object-position:${v.pos};transform:scale(${v.zoom||1});transform-origin:0 0"></div>`;
 if(v.type==='phone') h+=`<div class="abs card" style="left:820px;top:72px;width:250px;height:500px;border-radius:32px"><img src="${v.src}" style="object-position:50% 0"></div>`;
 if(v.type==='portrait') h+=`<div class="abs card" style="left:760px;top:60px;width:380px;height:507px;border-radius:24px"><img src="${v.src}" style="object-position:${v.pos}"></div>`;
 if(v.type==='phones'){
  const xs=[650,826,1002-8],ys=[150,90,190];
  v.srcs.forEach((s,i)=>{h+=`<div class="abs card" style="left:${xs[i]}px;top:${ys[i]}px;width:150px;height:267px;border-radius:14px"><img src="${s}"></div>`;});
 }
 if(v.type==='plans'){
  v.rows.forEach((r,i)=>{h+=`<div class="abs plan ${i===1?'on':''}" style="left:740px;top:${126+i*92}px"><span>${r[0]}</span><b>${r[1]}</b></div>`;});
 }
 h+=`<div class="abs lock"><img src="assets/mark.png">Echo<b>Pulse</b><span class="m">Media</span></div>`;
 const eb=p.eyebrow?`<div class="abs eyebrow" id="e"><i></i>${p.eyebrow}</div>`:'';
 h+=eb;
 h+=`<div class="abs h" id="h" style="width:${colW}px;font-size:${fs}px">${p.headline.replace(/\n/g,'<br>').replace(/\*(.+?)\*/g,(m,x)=>`<em${/\d-/.test(x)?' style="white-space:nowrap"':''}>${x}</em>`)}</div>`;
 h+=`<div class="abs sub" id="s" style="width:${colW-(wide?40:0)}px;font-size:${wide?25:22}px">${p.sub}</div>`;
 h+=`<div class="abs cta"><span>${(p.pill||'echopulse.media').replace('echopulse.media','<span class="o">echopulse.media</span>')}</span><span class="dot"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0C0C0B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>`;
 c.innerHTML=h;
 await document.fonts.ready;
 await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
 const hh=document.getElementById('h'), ss=document.getElementById('s'), ee=document.getElementById('e');
 const ctaTop=627-60-52;
 let cur=fs; const eh=ee?ee.offsetHeight+14:0; while(cur>54 && (ctaTop-34-ss.offsetHeight-18-hh.offsetHeight-eh)<112){cur-=3; hh.style.fontSize=cur+'px';}
 const sTop=ctaTop-34-ss.offsetHeight; ss.style.top=sTop+'px';
 const hTop=sTop-18-hh.offsetHeight; hh.style.top=hTop+'px';
 if(ee) ee.style.top=(hTop-14-ee.offsetHeight)+'px';
 const top=ee?ee.offsetTop:hTop;
 return {top, sBottom:sTop+ss.offsetHeight, ctaTop, lines:Math.round(hh.offsetHeight/(parseFloat(hh.style.fontSize)*1.04)), fs:parseFloat(hh.style.fontSize)};
};
</script></body></html>
